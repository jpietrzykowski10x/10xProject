name: Deploy backend

on:
  push:
    branches: [main]
    paths:
      - 'backend-subtracker/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash
    working-directory: backend-subtracker

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend-subtracker/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run prepare-mydevil

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.MYDEVIL_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.MYDEVIL_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Deploy to MyDevil
        env:
          MYDEVIL_HOST: ${{ secrets.MYDEVIL_HOST }}
          MYDEVIL_USER: ${{ secrets.MYDEVIL_USER }}
        run: |
          tar czf - -C .mydevil . \
            | ssh -i ~/.ssh/deploy_key -o BatchMode=yes "$MYDEVIL_USER@$MYDEVIL_HOST" "deploy api $GITHUB_SHA"
