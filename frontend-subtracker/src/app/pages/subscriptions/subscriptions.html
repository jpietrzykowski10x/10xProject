<main class="page">
  <h1>Twoje subskrypcje</h1>
  <p>Zalogowano jako {{ user()?.email }}</p>
  <p>Nie masz jeszcze żadnych subskrypcji.</p>

  @if (logoutFailed()) {
    <p class="message message--error" role="alert">
      Serwis jest chwilowo niedostępny. Nie udało się wylogować, spróbuj ponownie za chwilę.
    </p>
  }

  <button type="button" [disabled]="loggingOut()" (click)="logout()">Wyloguj</button>
</main>
